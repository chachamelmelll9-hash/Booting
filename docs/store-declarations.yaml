# 스토어 선언 데이터 (declarations-as-data)
#
# 생성: /preflight (2026-08-31)
# 근거: prd.md, 그리고 preflight 대화에서 사용자가 직접 고른 답변
#
# ⚠️ 아래 `TODO(user)` 로 표시된 값은 사용자만 답할 수 있는 실제 신원·주소 정보다.
#    AI가 채우지 않는다. 비어 있는 동안 /launch 는 phase_deferred 로 빠진다.

submit_policy: first-app-manual

business:
  # preflight 답변: "개인 개발자"
  name: "" # TODO(user): Play/App Store에 공개될 개발자 표시명 (실명 또는 개인 개발자명)
  representative: "" # TODO(user): 대표자명 (개인 개발자면 name과 동일)
  address: "" # TODO(user): Play는 공개 연락처 주소가 필수
  phone: "" # TODO(user)
  email: "chachamelmelll9@gmail.com"
  privacy_officer:
    name: "" # TODO(user): 개인정보 보호책임자 (개인 개발자면 본인)
    email: "chachamelmelll9@gmail.com"

listing:
  # PRD 1.2 "자녀 주도형 황혼 인연 매칭 서비스" 기준
  category_ios: "Social Networking"
  category_android: "데이팅"
  copyright: "" # TODO(user): 예 "2026 홍길동" — business.name 확정 후 채운다
  support_url: "" # 비우면 https://{PAGES_PROJECT}.pages.dev/support
  marketing_url: ""

pricing:
  # preflight 답변: "무료 · 광고 없음"
  model: free
  price_tier: "0"

# PRD 전반이 한국 행정구역·가족관계증명서 전제 — 한국 단독 출시
countries: ["KR"]

# ⚠️ 아래 age_rating 답변은 PRD 근거로 채운 초안이다. 스토어 제출 전 사용자 확인 필요.
#    (IARC 설문은 사용자가 진실이라고 선언하는 항목이다)
age_rating:
  violence: none
  sexual_content: none # 매칭 서비스이나 성적 콘텐츠를 담지 않는다
  profanity: none
  drugs_alcohol_tobacco: none # 음주·흡연은 프로필 '여부' 항목일 뿐, 묘사가 아니다
  gambling_simulated: none
  horror_fear: none
  user_generated_content: true # 프로필 소개글·사진·자녀 간 메시지 (PRD 5, 11)
  unrestricted_web_access: false
  ios_override: not_applicable

target_audience:
  # PRD 4.1 — 가입과 조작의 주체는 성인 자녀. 데이팅 카테고리는 18+ 가 요구된다
  age_groups: ["18+"]
  appeals_to_children: false

data_safety:
  # 근거: PRD 5(프로필 정보), 7(공개 범위), 15(개인정보 보호 원칙)
  # 주의: 휴대폰번호와 가족관계증명서도 수집한다. 전자는 Play "Phone number",
  #       후자는 "Other documents"로 매핑해야 한다 — /launch 가 폼을 채울 때 반영한다.
  collects:
    - email
    - name
    - user_id
    - photos
    - location # 시·군·구 단위 (근사 위치). 실시간 GPS는 수집하지 않는다 (PRD 8.1)
    - user_content
  shared_with_third_parties: []
  encrypted_in_transit: true
  deletion_request_supported: true
  purposes: [app_functionality]

ads:
  # preflight 답변: "무료 · 광고 없음" — app.config.ts 의 AdMob 설정과 일치해야 한다
  contains_ads: false
  ad_id_used: false

app_access:
  login_required: true
  demo_account:
    seed: true
    email: ""
    password_file: .launch-demo-account

declarations:
  government_app: false
  financial_features: false
  health_features: none
  export_compliance_uses_encryption: false

landing:
  tagline: "우리 부모님의 새로운 인연을, 가장 잘 아는 자녀가 소개합니다."
  target_audience: "이혼 또는 사별한 부모님의 새로운 인연을 찾아드리고 싶은 성인 자녀"
