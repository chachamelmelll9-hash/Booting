<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>Booting promo — animation timeline</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard-dynamic-subset.css">
<style>
  :root{
    --teal:#14B8A6; --teal-d:#0D9488; --teal-dd:#0F766E; --teal-l:#CCFBF1; --teal-s:#F0FDFA;
    --ink:#0F172A; --ink2:#334155; --ink3:#64748B; --ink4:#94A3B8; --bg:#F8FAFC;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{
    font-family:Pretendard,'Malgun Gothic',sans-serif; background:var(--bg); color:var(--ink);
    -webkit-font-smoothing:antialiased; overflow:hidden;
  }
  #root{position:relative;overflow:hidden;background:var(--bg)}
  .scene{position:absolute;inset:0;opacity:0;will-change:opacity,transform}
  .blob{position:absolute;border-radius:50%;filter:blur(110px);pointer-events:none}

  /* text */
  .txt{position:absolute;will-change:transform,opacity}
  .eyebrow{font-weight:700;letter-spacing:.09em;color:var(--teal-d)}
  .head{font-weight:800;letter-spacing:-.035em;line-height:1.25}
  .head .hl{color:var(--teal-d)}
  .head .dim{color:var(--ink4)}
  .sub{color:var(--ink3);font-weight:500;line-height:1.55}
  .step{font-weight:700;letter-spacing:.12em;color:var(--teal)}
  .mark{font-weight:800;letter-spacing:-.05em;color:var(--teal-dd)}
  .rule{height:10px;border-radius:99px;background:var(--teal)}
  .chip{
    display:inline-block;font-weight:600;color:var(--ink4);border:3px solid #E2E8F0;
    border-radius:999px;background:#fff;white-space:nowrap;
  }

  /* phone */
  .phone{position:absolute;background:#0B1220;will-change:transform,opacity}
  .screen{position:absolute;overflow:hidden;background:#fff}
  .layer{position:absolute;left:0;top:0;width:100%;will-change:transform,opacity}
  .layer img{display:block;width:100%}
  .ring{position:absolute;border-style:solid;border-color:var(--teal);
        box-shadow:0 0 0 10px rgba(20,184,166,.20),0 0 46px rgba(20,184,166,.45);
        will-change:transform,opacity}
  .tap{position:absolute;border-radius:50%;background:rgba(20,184,166,.30);
       border:5px solid rgba(13,148,136,.85);will-change:transform,opacity}
</style>
</head>
<body>
<div id="root"></div>
<script>
// ---------------------------------------------------------------- utilities
const Q = new URLSearchParams(location.search);
const WIDE = Q.get('layout') === 'wide';
const W = WIDE ? 1920 : 1080, H = WIDE ? 1080 : 1920;
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const eOut = p => 1 - Math.pow(1 - p, 3);
const eInOut = p => p < .5 ? 4*p*p*p : 1 - Math.pow(-2*p+2, 3)/2;
// ramp: 0 before s, 1 after s+d
const ramp = (t, s, d, ease = eOut) => ease(clamp((t - s) / d, 0, 1));

// phone geometry per layout.
// wide: the phone is deliberately taller than the frame so it bleeds off the
// bottom - a 9:19.5 screen can only be ~500px wide at 1080 tall, and a phone
// floating in the middle of a 1920 frame leaves the thing looking empty.
const PH = WIDE
  ? { x: 1257, y: 62, w: 556, h: 1124, pad: 12, r: 56, sr: 46 }
  : { x: 190,  y: 470, w: 700, h: 1420, pad: 12, r: 64, sr: 53 };
PH.sw = PH.w - PH.pad * 2;           // screen width
PH.sh = PH.h - PH.pad * 2;           // screen height
const SCALE = PH.sw / 1080;          // source px -> screen px
const VIS = PH.sh / SCALE;           // source px visible in the screen

// mint panel that the phone sits on (wide only)
const PANEL = { x: 1150, w: W - 1150 };

// text column
const COL = WIDE ? { x: 112, w: 950 } : { x: 104, w: 872 };
// font sizes
const FS = WIDE
  ? { eyebrow: 36, head: 100, headSm: 86, sub: 42, step: 30, cap: 84, capSub: 38, mark: 112, chip: 34 }
  : { eyebrow: 38, head: 106, headSm: 88, sub: 43, step: 29, cap: 68, capSub: 36, mark: 118, chip: 35 };

// ---------------------------------------------------------------- timeline
// scroll values are SOURCE pixels shown at the top of the phone screen.
const SC = [
  { id: 's1', start: 0.0, dur: 5.5, kind: 'type', align: WIDE ? 'center' : 'left',
    blobs: [{ w: 820, h: 820, c: '#CCFBF1', o: .55, x: -240, y: -220 }],
    eyebrow: '부모님의 다음 인연',
    head: '어머니가<br>혼자 되신 지<br><b class="hl">3년.</b>',
    sub: '좋은 분 계시면 좋겠는데,<br>어떻게 해드려야 할지 모르겠습니다.' },

  { id: 's2', start: 5.5, dur: 6.0, kind: 'type', align: WIDE ? 'center' : 'left',
    head: '그런데 정작<br><b class="dim">어머니껜</b><br><b class="dim">앱이 너무 멉니다.</b>',
    headSm: true,
    chips: ['회원가입', '사진 등록', '작은 글씨', '낯선 화면'],
    sub: '"엄마, 앱 하나만 깔아봐"는<br>해결이 아니었습니다.' },

  { id: 's3', start: 11.5, dur: 4.5, kind: 'type', align: 'center', logo: true,
    blobs: [{ w: 960, h: 960, c: '#CCFBF1', o: .5, x: WIDE ? 480 : 60, y: WIDE ? 300 : 560 }],
    head: '그래서<br><b class="hl">자녀가 대신합니다.</b>',
    sub: '찾는 건 자녀가,<br>정하는 건 부모님이.' },

  { id: 's4', start: 16.0, dur: 7.5, kind: 'phone',
    step: '01 · 매일 도착', cap: '매일 <b class="hl">6장</b>,<br>사주 궁합까지 보고 고릅니다',
    capSub: '지역 · 나이 · 관계 목적으로 추린 분들만',
    layers: [
      { img: '01_home_gems', from: 0, scroll: [80, 0] },
      { img: '02_expanded', from: 4.3, enter: 'fade' }
    ],
    taps: [{ at: 3.8, x: 197, y: 1262 }],
    ring: { at: 1.1, src: [42, 589, 993, 887] } },

  { id: 's5', start: 23.5, dur: 6.5, kind: 'phone',
    step: '02 · 사람을 봅니다', cap: '<b class="hl">자녀가 쓴 소개</b>로<br>부모님을 소개합니다',
    capSub: '취미 · 생활 · 만나고 싶은 분까지',
    layers: [
      { img: '04_profile_mid', from: 0, enter: 'push' },
      { img: '05_profile_low', from: 3.4, enter: 'scroll' }
    ],
    ring: { at: 1.0, out: 3.0, src: [60, 380, 960, 560] } },

  { id: 's6', start: 30.0, dur: 7.0, kind: 'phone',
    step: '03 · 1차 매칭', cap: '먼저 <b class="hl">자녀끼리</b><br>이야기를 나눕니다',
    capSub: '아직 부모님께는 알려드리기 전입니다',
    layers: [
      { img: '07_matched', from: 0, enter: 'push' },
      { img: '08_chat', from: 4.2, enter: 'push' }
    ],
    taps: [{ at: 3.7, x: 540, y: 2138 }],
    ring: { at: 0.9, out: 3.4, src: [60, 330, 960, 300] } },

  { id: 's7', start: 37.0, dur: 7.5, kind: 'phone',
    step: '04 · 부모님께', cap: '괜찮다 싶으면<br><b class="hl">카톡으로 보내드립니다</b>',
    capSub: '부모님은 앱 설치도, 가입도 필요 없습니다',
    layers: [{ img: '09_connections', from: 0, enter: 'push' }],
    ring: { at: 2.2, src: [846, 500, 160, 82] },
    taps: [{ at: 4.6, x: 926, y: 540 }] },

  { id: 's8', start: 44.5, dur: 7.5, kind: 'phone', parent: true,
    step: '05 · 최종 결정', cap: '정하시는 분은<br><b class="hl">부모님입니다</b>',
    capSub: '큰 글씨로, 버튼 하나로',
    layers: [{ img: '13_tall', from: 0, enter: 'fade', scroll: [1500, 2170] }],
    ring: { at: 4.6, srcAbs: [54, 3848, 972, 96], scrollRef: 0 },
    taps: [{ at: 6.4, xAbs: 540, yAbs: 3896, scrollRef: 0 }] },

  { id: 's9', start: 52.0, dur: 5.0, kind: 'phone', parent: true,
    step: '06 · 두 분이 맞을 때', cap: '두 분 <b class="hl">모두 원하실 때만</b><br>연락처가 열립니다',
    capSub: '그전까지 실명도 번호도 공개되지 않습니다',
    layers: [{ img: '14_tall', from: 0, enter: 'fade', scroll: [2080, 2420] }],
    ring: { at: 1.9, srcAbs: [54, 3760, 972, 300], scrollRef: 0 } },

  { id: 's10', start: 57.0, dur: 3.0, kind: 'type', align: 'center', logo: true, cta: true,
    blobs: [{ w: 1040, h: 1040, c: '#CCFBF1', o: .5, x: WIDE ? 440 : 20, y: -260 },
            { w: 860, h: 860, c: '#F0FDFA', o: .9, x: WIDE ? 700 : 290, y: H - 300 }],
    head: '부모님의 다음 인연,<br><b class="hl">자녀의 손으로.</b>',
    sub: '사별·이혼하신 부모님을 위한 매칭' }
];
const TOTAL = 60.0, XF = 0.5;

// ---------------------------------------------------------------- build DOM
const root = document.getElementById('root');
root.style.width = W + 'px';
root.style.height = H + 'px';
document.body.style.width = W + 'px';
document.body.style.height = H + 'px';

const nodes = {};
for (const s of SC) {
  const el = document.createElement('div');
  el.className = 'scene';
  el.id = s.id;
  const n = { el, lines: [], chips: [], layers: [], taps: [] };

  for (const b of (s.blobs || [])) {
    const d = document.createElement('div');
    d.className = 'blob';
    d.style.cssText = `width:${b.w}px;height:${b.h}px;background:${b.c};opacity:${b.o};left:${b.x}px;top:${b.y}px`;
    el.appendChild(d);
  }

  const mk = (cls, html, css) => {
    const d = document.createElement('div');
    d.className = 'txt ' + cls;
    d.innerHTML = html;
    d.style.cssText += css;
    el.appendChild(d);
    n.lines.push(d);
    return d;
  };

  if (s.kind === 'type') {
    const cx = s.align === 'center' ? `left:0;width:${W}px;text-align:center` : `left:${COL.x}px;width:${COL.w}px`;
    const parts = [];
    if (s.logo) parts.push(['mark', 'Booting', `font-size:${FS.mark}px`]);
    // an absolutely positioned rule cannot centre with margin:auto - place it
    if (s.logo) parts.push(['rule', '', s.align === 'center'
      ? `left:${(W - 128) / 2}px;width:128px` : `width:128px`]);
    if (s.eyebrow) parts.push(['eyebrow', s.eyebrow, `font-size:${FS.eyebrow}px`]);
    parts.push(['head', s.head, `font-size:${s.headSm ? FS.headSm : (s.cta ? FS.head * .78 : FS.head)}px`]);
    if (s.chips) parts.push(['chips', '', '']);
    if (s.sub) parts.push(['sub', s.sub, `font-size:${FS.sub}px`]);

    // vertical stack, centred as a group
    const gap = [];
    let total = 0;
    const measured = [];
    for (const [cls, html, css] of parts) {
      if (cls === 'chips') {
        const d = document.createElement('div');
        d.className = 'txt chips';
        d.style.cssText += cx;
        for (const c of s.chips) {
          const c1 = document.createElement('span');
          c1.className = 'chip';
          c1.textContent = c;
          c1.style.cssText = `font-size:${FS.chip}px;padding:${FS.chip * .55}px ${FS.chip}px;margin:0 ${FS.chip * .28}px ${FS.chip * .45}px 0`;
          d.appendChild(c1);
          n.chips.push(c1);
        }
        el.appendChild(d);
        n.lines.push(d);
        measured.push(d);
      } else {
        measured.push(mk(cls, html, cx + ';' + css));
      }
    }
    n.stack = measured;
  } else {
    // caption
    const capX = WIDE ? `left:${COL.x}px;width:${COL.w}px` : `left:${COL.x}px;width:${COL.w}px`;
    n.step = mk('step', s.step, `${capX};font-size:${FS.step}px`);
    n.cap = mk('head', s.cap, `${capX};font-size:${FS.cap}px`);
    n.capSub = mk('sub', s.capSub, `${capX};font-size:${FS.capSub}px`);
    n.stack = [n.step, n.cap, n.capSub];

    // mint panel behind the phone (wide only) so the right half is not empty
    if (WIDE) {
      const pn = document.createElement('div');
      pn.className = 'panel';
      pn.style.cssText = `position:absolute;left:${PANEL.x}px;top:0;width:${PANEL.w}px;height:${H}px;` +
        `background:linear-gradient(160deg,#F0FDFA 0%,#CCFBF1 100%)`;
      el.appendChild(pn);
      n.panel = pn;
      const wm = document.createElement('div');
      wm.className = 'txt mark';
      wm.textContent = 'Booting';
      wm.style.cssText += `left:${COL.x}px;top:${H - 128}px;font-size:46px;opacity:.9`;
      el.appendChild(wm);
      n.wordmark = wm;
    }

    // phone
    const ph = document.createElement('div');
    ph.className = 'phone';
    ph.style.cssText = `left:${PH.x}px;top:${PH.y}px;width:${PH.w}px;height:${PH.h}px;border-radius:${PH.r}px;` +
      `box-shadow:0 64px 130px -34px rgba(15,23,42,.45),0 0 0 1px rgba(15,23,42,.05)`;
    const sc = document.createElement('div');
    sc.className = 'screen';
    sc.style.cssText = `left:${PH.pad}px;top:${PH.pad}px;width:${PH.sw}px;height:${PH.sh}px;border-radius:${PH.sr}px`;
    ph.appendChild(sc);
    el.appendChild(ph);
    n.phone = ph; n.screenEl = sc;

    for (const L of s.layers) {
      const d = document.createElement('div');
      d.className = 'layer';
      const im = document.createElement('img');
      im.src = 'screens/' + L.img + '.png';
      d.appendChild(im);
      sc.appendChild(d);
      n.layers.push(d);
    }
    if (s.ring) {
      const r = document.createElement('div');
      r.className = 'ring';
      sc.appendChild(r);
      n.ringEl = r;
    }
    for (const _ of (s.taps || [])) {
      const d = document.createElement('div');
      d.className = 'tap';
      sc.appendChild(d);
      n.taps.push(d);
    }
  }
  root.appendChild(el);
  nodes[s.id] = n;
}

// centre each text stack vertically once fonts are ready
function layoutStacks() {
  for (const s of SC) {
    const n = nodes[s.id];
    const gapFor = (el) => el.classList.contains('rule') ? 46
      : el.classList.contains('mark') ? 40
      : el.classList.contains('eyebrow') ? 34
      : el.classList.contains('head') ? 42
      : el.classList.contains('chips') ? 40 : 0;
    let h = 0;
    const hs = n.stack.map(e => e.offsetHeight);
    hs.forEach((v, i) => { h += v + (i < n.stack.length - 1 ? gapFor(n.stack[i]) : 0); });
    let y = s.kind === 'type'
      ? (H - h) / 2
      : (WIDE ? (H - h) / 2 : 70);
    n.stackTop = y;
    n.stack.forEach((e, i) => {
      e.style.top = y + 'px';
      e.dataset.y0 = y;
      y += hs[i] + gapFor(e);
    });
  }
}

// ---------------------------------------------------------------- seek
function seek(t) {
  for (const s of SC) {
    const n = nodes[s.id];
    const lt = t - s.start;                       // local time
    const end = s.dur;
    // scene opacity: fade in over XF, fade out over XF at the end
    let o = 0;
    if (lt > -XF && lt < end + XF) {
      // the outgoing scene fades out ACROSS the incoming one's fade-in
      // (fading out before the next starts leaves a blank frame at the seam)
      const fadeIn = s.start === 0 ? 1 : ramp(lt, 0, XF, eInOut);
      o = clamp(Math.min(fadeIn, 1 - ramp(lt, end, XF, eInOut)), 0, 1);
    }
    n.el.style.opacity = o;
    n.el.style.display = o <= 0.001 ? 'none' : 'block';
    if (o <= 0.001) continue;

    // slow drift of the whole scene
    const drift = (lt / end - .5) * (s.kind === 'type' ? 16 : 10);
    n.el.style.transform = `translateY(${drift}px)`;

    // text stagger (the opening scene starts mid-move so frame 0 is not empty)
    const st0 = s.start === 0 ? -0.38 : 0.10;
    n.stack.forEach((e, i) => {
      const p = ramp(lt, st0 + i * 0.13, 0.75);
      e.style.opacity = p;
      e.style.transform = `translateY(${(1 - p) * 46}px)`;
    });
    if (n.chips.length) {
      n.chips.forEach((c, i) => {
        const p = ramp(lt, 0.75 + i * 0.09, 0.45);
        c.style.opacity = p;
        c.style.transform = `scale(${0.88 + 0.12 * p})`;
      });
    }

    if (s.kind !== 'phone') continue;

    // phone entry + float
    const pe = ramp(lt, 0.25, 0.9);
    const float = Math.sin((lt / end) * Math.PI) * -8;
    n.phone.style.opacity = pe;
    n.phone.style.transform = `translateY(${(1 - pe) * 70 + float}px) scale(${0.985 + 0.015 * pe})`;

    // layers
    let topScroll = 0;
    s.layers.forEach((L, i) => {
      const el = n.layers[i];
      const lp = L.from === 0 ? 1 : ramp(lt, L.from, 0.55, eInOut);
      let tx = 0, ty = 0, op = 1;
      // per-layer scroll (source px at top of screen)
      let srcTop = 0;
      if (L.scroll) {
        const q = eInOut(clamp((lt - (L.from || 0)) / Math.max(end - (L.from || 0) - 0.4, .1), 0, 1));
        srcTop = L.scroll[0] + (L.scroll[1] - L.scroll[0]) * q;
      }
      ty = -srcTop * SCALE;
      if (i === 0) topScroll = srcTop;

      if (L.from > 0) {
        if (L.enter === 'push') { tx = (1 - lp) * PH.sw; op = 1; }
        else if (L.enter === 'scroll') { ty -= (1 - lp) * 240; op = lp; }
        else { op = lp; }
        el.style.zIndex = 5 + i;
      } else {
        el.style.zIndex = 5 + i;
      }
      el.style.opacity = op;
      el.style.transform = `translate(${tx}px, ${ty}px)`;
    });

    // ring
    if (s.ring && n.ringEl) {
      const r = s.ring;
      const inP = ramp(lt, r.at, 0.55);
      const outP = r.out ? ramp(lt, r.out, 0.4) : 0;
      const op = clamp(inP - outP, 0, 1);
      let x, y, w, h;
      if (r.srcAbs) {
        const ref = s.layers[r.scrollRef || 0];
        const q = eInOut(clamp((lt - (ref.from || 0)) / Math.max(end - (ref.from || 0) - 0.4, .1), 0, 1));
        const srcTop = ref.scroll ? ref.scroll[0] + (ref.scroll[1] - ref.scroll[0]) * q : 0;
        x = r.srcAbs[0] * SCALE; y = (r.srcAbs[1] - srcTop) * SCALE;
        w = r.srcAbs[2] * SCALE; h = r.srcAbs[3] * SCALE;
      } else {
        x = r.src[0] * SCALE; y = r.src[1] * SCALE; w = r.src[2] * SCALE; h = r.src[3] * SCALE;
      }
      const pulse = 1 + 0.05 * (1 - eOut(clamp((lt - r.at) / 0.7, 0, 1)));
      n.ringEl.style.cssText += '';
      n.ringEl.style.left = x + 'px'; n.ringEl.style.top = y + 'px';
      n.ringEl.style.width = w + 'px'; n.ringEl.style.height = h + 'px';
      n.ringEl.style.borderWidth = Math.max(5, 7 * SCALE / 0.63) + 'px';
      n.ringEl.style.borderRadius = 26 * SCALE / 0.63 + 'px';
      n.ringEl.style.opacity = op;
      n.ringEl.style.transform = `scale(${pulse})`;
      n.ringEl.style.zIndex = 20;
    }

    // taps
    (s.taps || []).forEach((tp, i) => {
      const el = n.taps[i];
      const p = clamp((lt - tp.at) / 0.6, 0, 1);
      let x, y;
      if (tp.xAbs !== undefined) {
        const ref = s.layers[tp.scrollRef || 0];
        const q = eInOut(clamp((lt - (ref.from || 0)) / Math.max(end - (ref.from || 0) - 0.4, .1), 0, 1));
        const srcTop = ref.scroll ? ref.scroll[0] + (ref.scroll[1] - ref.scroll[0]) * q : 0;
        x = tp.xAbs * SCALE; y = (tp.yAbs - srcTop) * SCALE;
      } else {
        x = tp.x * SCALE; y = tp.y * SCALE;
      }
      const size = 120 * SCALE;
      el.style.left = (x - size / 2) + 'px';
      el.style.top = (y - size / 2) + 'px';
      el.style.width = size + 'px';
      el.style.height = size + 'px';
      el.style.opacity = p <= 0 || p >= 1 ? 0 : (1 - p) * 0.95;
      el.style.transform = `scale(${0.45 + 1.15 * eOut(p)})`;
      el.style.zIndex = 30;
    });
  }
}

window.seek = seek;
window.__ready = false;
(async () => {
  await document.fonts.ready;
  await Promise.all([...document.images].map(im => im.complete ? 1 : new Promise(r => { im.onload = im.onerror = r; })));
  layoutStacks();
  seek(0);
  window.__ready = true;
})();
</script>
</body>
</html>
