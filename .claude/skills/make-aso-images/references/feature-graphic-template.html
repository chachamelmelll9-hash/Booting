<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    width: 1024px;
    height: 500px;
    background: {{BG_COLOR}};
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 48px;
    overflow: hidden;
    font-family: -apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif;
  }

  .icon {
    width: 220px;
    height: 220px;
    border-radius: 48px;
    box-shadow: 0 12px 32px rgba(0,0,0,0.2);
  }

  .text {
    max-width: 560px;
  }

  .app-name {
    color: {{TEXT_COLOR}};
    font-size: 72px;
    font-weight: 800;
    line-height: 1.15;
  }

  .tagline {
    color: {{TEXT_COLOR}};
    opacity: 0.85;
    font-size: 34px;
    font-weight: 600;
    margin-top: 16px;
    line-height: 1.3;
  }
</style>
</head>
<body>
  <img class="icon" src="{{ICON_PATH}}" />
  <div class="text">
    <div class="app-name">{{APP_NAME}}</div>
    <div class="tagline">{{TAGLINE}}</div>
  </div>
</body>
</html>
