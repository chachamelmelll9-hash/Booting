name: Rotate Apple Sign-in Secret

on:
  schedule:
    # Every 5 months (runs on 1st day at 00:00 UTC)
    # Jan, Jun, Nov cycle
    - cron: '0 0 1 1,6,11 *'
  workflow_dispatch:

jobs:
  rotate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - name: Check required secrets
        env:
          APPLE_P8_KEY: ${{ secrets.APPLE_P8_KEY }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_KEY_ID: ${{ secrets.APPLE_KEY_ID }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          MISSING=""
          [ -z "$APPLE_P8_KEY" ] && MISSING="$MISSING APPLE_P8_KEY"
          [ -z "$APPLE_TEAM_ID" ] && MISSING="$MISSING APPLE_TEAM_ID"
          [ -z "$APPLE_KEY_ID" ] && MISSING="$MISSING APPLE_KEY_ID"
          [ -z "$SUPABASE_PROJECT_REF" ] && MISSING="$MISSING SUPABASE_PROJECT_REF"
          [ -z "$SUPABASE_ACCESS_TOKEN" ] && MISSING="$MISSING SUPABASE_ACCESS_TOKEN"
          if [ -n "$MISSING" ]; then
            echo "::error::Missing GitHub Secrets:$MISSING"
            exit 1
          fi

      - name: Generate Apple client secret JWT
        id: jwt
        env:
          APPLE_P8_KEY: ${{ secrets.APPLE_P8_KEY }}
        run: |
          printf '%s\n' "$APPLE_P8_KEY" > /tmp/authkey.p8

          TEAM_ID="${{ secrets.APPLE_TEAM_ID }}"
          KEY_ID="${{ secrets.APPLE_KEY_ID }}"
          CLIENT_ID="com.myorg.myapp"

          JWT=$(node -e "
          const crypto = require('crypto');
          const fs = require('fs');
          const privateKey = fs.readFileSync('/tmp/authkey.p8', 'utf8');
          const now = Math.floor(Date.now() / 1000);
          const header = { alg: 'ES256', kid: '${KEY_ID}' };
          const payload = {
            iss: '${TEAM_ID}',
            iat: now,
            exp: now + (86400 * 180),
            aud: 'https://appleid.apple.com',
            sub: '${CLIENT_ID}',
          };
          function base64url(data) { return Buffer.from(data).toString('base64url'); }
          const headerB64 = base64url(JSON.stringify(header));
          const payloadB64 = base64url(JSON.stringify(payload));
          const signingInput = headerB64 + '.' + payloadB64;
          const sign = crypto.createSign('SHA256');
          sign.update(signingInput);
          const signature = sign.sign(privateKey);
          function derToRaw(derSig) {
            let offset = 2;
            if (derSig[1] & 0x80) offset += (derSig[1] & 0x7f);
            offset++;
            let rLen = derSig[offset++];
            let r = derSig.slice(offset, offset + rLen);
            offset += rLen;
            offset++;
            let sLen = derSig[offset++];
            let s = derSig.slice(offset, offset + sLen);
            if (r.length > 32) r = r.slice(r.length - 32);
            if (s.length > 32) s = s.slice(s.length - 32);
            const rPad = Buffer.alloc(32); r.copy(rPad, 32 - r.length);
            const sPad = Buffer.alloc(32); s.copy(sPad, 32 - s.length);
            return Buffer.concat([rPad, sPad]);
          }
          const rawSig = derToRaw(signature);
          process.stdout.write(signingInput + '.' + rawSig.toString('base64url'));
          ")

          rm -f /tmp/authkey.p8

          if [ -z "$JWT" ]; then
            echo "::error::Apple client secret JWT generation failed"
            exit 1
          fi

          echo "::add-mask::$JWT"
          echo "token=${JWT}" >> "$GITHUB_OUTPUT"

      - name: Update Supabase Apple provider secret
        run: |
          HTTP_STATUS=$(curl -s -o /dev/null -w '%{http_code}' -X PATCH \
            "https://api.supabase.com/v1/projects/${{ secrets.SUPABASE_PROJECT_REF }}/config/auth" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ACCESS_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d "{
              \"EXTERNAL_APPLE_SECRET\": \"${{ steps.jwt.outputs.token }}\"
            }")

          if [ "$HTTP_STATUS" -lt 200 ] || [ "$HTTP_STATUS" -ge 300 ]; then
            echo "::error::Supabase auth config update failed (HTTP $HTTP_STATUS)"
            exit 1
          fi

          echo "Apple Sign-in secret rotated successfully (HTTP $HTTP_STATUS)"

      - name: Create issue on failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create --repo "${{ github.repository }}" \
            --title "Apple Sign-in secret rotation failed ($(date -u +%Y-%m-%d))" \
            --body "The rotate-apple-secret workflow failed. Apple client secrets expire after 6 months — investigate before sign-in breaks. Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            || echo "::warning::Could not create issue — check permissions"
