# 서버 배포 — 어느 클라우드인지 묻지 않는다.
#
# 하는 일은 "이미지를 GHCR 에 올리고, SSH 로 들어가 docker compose 를 다시 띄운다"
# 뿐이라 Oracle·AWS EC2·그 밖의 Ubuntu VM 어디서든 같다. 그래서 비밀값 이름도
# 특정 업체를 박지 않는다 (예전에는 ORACLE_* 였고, AWS 로 옮기며 바뀌었다 —
# 업체를 또 옮길 때 이름을 다시 바꾸지 않아도 되게 둔다).
name: Deploy Server

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'apps/server/**'
      - 'packages/supabase/**'
      - 'pnpm-lock.yaml'
      - '.github/workflows/deploy.yml'
      - '.dockerignore'
      - 'infra/**'

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck, lint, test (server + deps)
        run: pnpm turbo run typecheck lint test --filter=@chachamelmelll9-hash-service/server...

  build-and-deploy:
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Check required secrets
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_SSH_USER: ${{ secrets.DEPLOY_SSH_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          MISSING=""
          [ -z "$DEPLOY_HOST" ] && MISSING="$MISSING DEPLOY_HOST"
          [ -z "$DEPLOY_SSH_USER" ] && MISSING="$MISSING DEPLOY_SSH_USER"
          [ -z "$DEPLOY_SSH_KEY" ] && MISSING="$MISSING DEPLOY_SSH_KEY"
          if [ -n "$MISSING" ]; then
            echo "::warning::Deploy skipped — missing GitHub Secrets:$MISSING"
            echo "::notice::To enable server deployment, add the following secrets in Settings → Secrets and variables → Actions:"
            echo "::notice::  DEPLOY_HOST — server public IP (AWS EC2: the Elastic IP)"
            echo "::notice::  DEPLOY_SSH_USER — SSH username (Ubuntu AMI: ubuntu)"
            echo "::notice::  DEPLOY_SSH_KEY — SSH private key (the .pem contents)"
            echo "::notice::Setup guide: infra/EC2_GUIDE.md"
            exit 0
          fi
          echo "SECRETS_OK=true" >> "$GITHUB_ENV"

      - name: Checkout repository
        if: env.SECRETS_OK == 'true'
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        if: env.SECRETS_OK == 'true'
        uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        if: env.SECRETS_OK == 'true'
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Build and push (AMD64)
        if: env.SECRETS_OK == 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/server/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/booting-server:latest
          platforms: linux/amd64
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy to server
        if: env.SECRETS_OK == 'true'
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_SSH_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          envs: GITHUB_TOKEN,SERVER_IMAGE
          script: |
            echo "$GITHUB_TOKEN" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            cd "$HOME/app"
            export SERVER_IMAGE
            docker compose pull
            docker compose up -d --force-recreate
            docker image prune -f
            echo "Waiting for server health check (/api/health)..."
            if curl -sf --retry 12 --retry-delay 5 --retry-all-errors http://127.0.0.1:3000/api/health >/dev/null; then
              echo "Health check passed: /api/health responded 2xx"
            else
              echo "::error::Health check failed — server did not respond on /api/health"
              docker compose logs --tail=50 server
              exit 1
            fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SERVER_IMAGE: ghcr.io/${{ github.repository_owner }}/booting-server:latest
